<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนคลังสินค้า · OWHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2624;
    --paper:#eceee7;
    --paper-raised:#f5f6f1;
    --amber:#c47a2b;
    --amber-deep:#9c5f1f;
    --teal:#2f6e64;
    --teal-deep:#204b44;
    --alert:#a8432f;
    --alert-bg:#f3ddd4;
    --line: rgba(28,38,36,0.14);
    --muted: rgba(28,38,36,0.56);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    min-height:100vh;
    padding:48px 24px 80px;
  }

  .wrap{max-width:960px;margin:0 auto;}

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:8px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal-deep);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-size:clamp(28px,4vw,38px);
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    text-align:right;
  }
  .meta span{display:block;}

  /* controls */
  .controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin:28px 0 32px;
  }
  .search-box{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    border-radius:8px;
    font-family:'IBM Plex Sans Thai',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{border-color:var(--teal);}
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:13px;top:50%;
    transform:translateY(-50%);
    font-size:16px;
    color:var(--muted);
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
    letter-spacing:0.02em;
  }
  .chip:hover{border-color:var(--teal);color:var(--teal-deep);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  /* grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }

  .card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(28,38,36,0.08);
  }
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:var(--teal);
  }
  .card[data-status="inactive"]::before{background:var(--muted);}
  .card[data-status="alert"]::before{background:var(--alert);}

  .code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.01em;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .card[data-status="inactive"] .code{color:var(--muted);}

  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--teal);
    flex-shrink:0;
  }
  .card[data-status="inactive"] .dot{background:var(--muted);}
  .card[data-status="alert"] .dot{background:var(--alert);}

  .name{
    font-size:15.5px;
    font-weight:500;
    line-height:1.45;
    margin-bottom:14px;
    color:var(--ink);
  }
  .card[data-status="inactive"] .name{color:var(--muted);}

  .status-tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:4px 10px;
    border-radius:5px;
    background:rgba(47,110,100,0.12);
    color:var(--teal-deep);
  }
  .card[data-status="inactive"] .status-tag{
    background:rgba(28,38,36,0.08);
    color:var(--muted);
  }
  .card[data-status="alert"] .status-tag{
    background:var(--alert-bg);
    color:var(--alert);
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14.5px;
  }

  footer{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (max-width:560px){
    header{flex-direction:column;align-items:flex-start;}
    .meta{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">SAP Business One · OWHS</p>
      <h1>ทะเบียนคลังสินค้า</h1>
    </div>
    <div class="meta">
      <span id="count">5 คลัง</span>
      <span>อัปเดตล่าสุด: —</span>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input id="search" type="text" placeholder="ค้นหารหัสหรือชื่อคลัง...">
    </div>
    <div class="filters">
      <button class="chip active" data-filter="all">ทั้งหมด</button>
      <button class="chip" data-filter="active">ใช้งาน</button>
      <button class="chip" data-filter="inactive">ไม่ใช้</button>
      <button class="chip" data-filter="alert">เฝ้าระวัง</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span>ที่มา: select * from OWHS</span>
    <span>ทดสอบด้วยข้อมูลตัวอย่าง — ยังไม่เชื่อมต่อฐานข้อมูลจริง</span>
  </footer>

</div>

<script>
  const warehouses = [
    { code:"01",        name:"คลังโรงพยาบาล",             status:"active"  },
    { code:"C01-RT",    name:"คลังออฟฟิศ",                status:"active"  },
    { code:"C02-PR9",   name:"คลังโรงพยาบาล",             status:"inactive"},
    { code:"C03-HOLD",  name:"คลังยาใกล้หมดอายุ",         status:"alert"   },
    { code:"C04-CM",    name:"คลังฝากขาย",                status:"active"  },
  ];

  const statusLabel = { active:"● ใช้งาน", inactive:"○ ไม่ใช้งาน", alert:"⚠ เฝ้าระวัง" };

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('search');
  const countEl = document.getElementById('count');
  const chips = document.querySelectorAll('.chip');
  let activeFilter = 'all';

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = warehouses.filter(w=>{
      const matchesFilter = activeFilter === 'all' || w.status === activeFilter;
      const matchesSearch = !q || w.code.toLowerCase().includes(q) || w.name.toLowerCase().includes(q);
      return matchesFilter && matchesSearch;
    });

    countEl.textContent = filtered.length + ' คลัง';

    if(filtered.length === 0){
      grid.innerHTML = '<div class="empty">ไม่พบคลังที่ตรงกับคำค้นหา</div>';
      return;
    }

    grid.innerHTML = filtered.map(w => `
      <div class="card" data-status="${w.status}">
        <div class="code"><span class="dot"></span>${w.code}</div>
        <div class="name">${w.name}</div>
        <span class="status-tag">${statusLabel[w.status]}</span>
      </div>
    `).join('');
  }

  searchInput.addEventListener('input', render);
  chips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
